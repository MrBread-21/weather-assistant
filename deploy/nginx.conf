# Ví dụ cấu hình Nginx cho weather-assistant (tuỳ chọn).
# App tự phục vụ cả web tĩnh lẫn API ở 127.0.0.1:8100, nên chỉ cần proxy thẳng.
#
# LƯU Ý QUAN TRỌNG: định vị GPS trong trình duyệt CHỈ chạy trên HTTPS (hoặc localhost).
# Cách dễ nhất để có HTTPS là dùng Tailscale (không cần Nginx):
#     tailscale serve --bg 8100
# rồi mở link https://<tên-máy>.<tailnet>.ts.net trên điện thoại.
#
# Nếu vẫn muốn dùng Nginx, đặt file này vào /etc/nginx/sites-available/weather-assistant,
# ln -s sang sites-enabled, và cấu hình TLS (vd bằng certbot) cho server_name của bạn.

server {
    listen 80;
    server_name weather.example;   # đổi thành tên miền / subdomain của bạn

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
