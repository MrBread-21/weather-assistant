plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrbread.weather'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mrbread.weather'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Không cần thư viện ngoài: app chỉ dùng WebView của hệ thống Android.
